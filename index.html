  <script>
    (function generarIconoAppPNG() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
      bgGrad.addColorStop(0, '#161616'); bgGrad.addColorStop(1, '#050505');
      ctx.fillStyle = bgGrad;
      ctx.beginPath(); ctx.roundRect(0, 0, 512, 512, 110); ctx.fill();
      
      function drawCoin(cx, cy, r, mainColor, darkColor) {
        ctx.fillStyle = darkColor; ctx.beginPath(); ctx.arc(cx, cy + 14, r, 0, Math.PI * 2); ctx.fill();
        const grad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
        grad.addColorStop(0, '#FFF2B2'); grad.addColorStop(0.5, mainColor); grad.addColorStop(1, '#9A7B1C');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#3A2A00'; ctx.font = 'bold ' + Math.round(r * 0.95) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('€', cx, cy + 4);
      }
      drawCoin(175, 295, 85, '#D4AF37', '#6E550B');
      drawCoin(335, 285, 90, '#DFB83C', '#6E550B');
      drawCoin(256, 205, 112, '#F0C946', '#5C4506');
      const pngUrl = canvas.toDataURL('image/png');
      document.getElementById('favicon-link').href = pngUrl;
      document.getElementById('apple-icon-link').href = pngUrl;
      const manifest = { name: "Mi Control Financiero", short_name: "Finanzas", start_url: ".", display: "standalone", background_color: "#080808", theme_color: "#080808", icons: [{ src: pngUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }] };
      document.getElementById('manifest-link').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}));
      window.__appIconPNG = pngUrl;
    })();
  </script>

  <style>
    :root { --bg-black: #080808; --bg-card: #121212; --bg-input: #1A1A1A; --border: #242424; --gold: #D4AF37; --gold-light: #F3E5AB; --gold-glow: rgba(212, 175, 55, 0.22); --red: #E53935; --blue: #3B82F6; --green: #10B981; --text: #F5F5F5; --text-muted: #9E9E9E; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-black); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 95px; }
    
    #login-screen { position: fixed; inset: 0; background: var(--bg-black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; transition: opacity 0.4s; }
    .login-box { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--gold); border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 40px var(--gold-glow); }
    .login-logo { width: 80px; height: 80px; margin: 0 auto 16px; }
    .login-title { font-size: 1.4rem; font-weight: 800; color: var(--gold-light); margin-bottom: 8px; }
    .login-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
    .auth-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 14px; border-radius: 10px; margin-bottom: 14px; font-family: inherit; font-size: 1rem; }
    .btn-auth { width: 100%; background: linear-gradient(135deg, var(--gold), #A47E1B); color: #000; border: none; border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    .btn-auth-sec { width: 100%; background: transparent; color: var(--text-muted); font-size: 0.85rem; text-decoration: underline; border: none; cursor: pointer; }
    
    #app-main { display: none; width: 100%; }
    header { background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 38px; height: 38px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 14px var(--gold-glow); border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; }
    .brand-icon img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 1rem; font-weight: 700; color: var(--gold-light); }
    .cloud-status { font-size: 0.7rem; padding: 4px 8px; border-radius: 20px; background: rgba(16, 185, 129, 0.12); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    
    main { max-width: 900px; margin: 0 auto; width: 100%; padding: 18px 14px; }
    .tab-view { display: none; animation: fadeIn 0.2s ease; }
    .tab-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .card-header { font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .balances-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .balance-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .balance-box.gold-border { border-top: 3px solid var(--gold); }
    .balance-box.red-border { border-top: 3px solid var(--red); }
    .balance-title { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    .balance-amount { font-size: 1.55rem; font-weight: 800; color: var(--text); }
    .gold-text { color: var(--gold); } .red-text { color: var(--red); }
    
    .adjust-bar { display: flex; flex-wrap: wrap; gap: 10px; background: #151515; padding: 12px; border-radius: 10px; margin-bottom: 16px; border: 1px dashed var(--border); align-items: center; justify-content: space-between; }
    .adjust-bar button { background: var(--gold); color: #000; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    
    .advisor-header { background: linear-gradient(135deg, #1B1808, #141208); border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
    .rule-box { background: #141414; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
    .rule-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #222; margin-bottom: 12px; }
    .rule-seg-needs { background: #3B82F6; transition: width 0.3s; }
    .rule-seg-wants { background: var(--red); transition: width 0.3s; }
    .rule-seg-savings { background: var(--gold); transition: width 0.3s; }
    .advice-card { background: #151515; border-left: 4px solid var(--gold); padding: 14px; margin-bottom: 12px; font-size: 0.86rem; border-radius: 0 10px 10px 0;}
    .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .chart-box { position: relative; height: 240px; width: 100%; }
    
    .selector-tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .btn-tipo { padding: 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--bg-input); color: var(--text-muted); font-weight: 700; cursor: pointer; }
    .btn-tipo.active.gasto { border-color: var(--red); color: var(--red); background: rgba(229, 57, 53, 0.12); }
    .btn-tipo.active.ingreso { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, 0.12); }
    .input-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--gold), #A47E1B); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; }
