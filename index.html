<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finanzas</title>

  <!-- Configuración de App Nativa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080808">

  <!-- Enlaces de Iconos dinámicos -->
  <link id="favicon-link" rel="icon" type="image/png" href="">
  <link id="apple-icon-link" rel="apple-touch-icon" sizes="180x180" href="">
  <link id="manifest-link" rel="manifest" href="">

  <!-- Script Generador de Icono -->
  <script>
    (function generarIconoAppPNG() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
      bgGrad.addColorStop(0, '#161616'); bgGrad.addColorStop(1, '#050505');
      ctx.fillStyle = bgGrad;
      ctx.beginPath(); ctx.roundRect(0, 0, 512, 512, 110); ctx.fill();

      ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 8; ctx.strokeRect(16, 16, 480, 480);

      function drawCoin(cx, cy, r, mainColor, darkColor) {
        ctx.fillStyle = darkColor; ctx.beginPath(); ctx.arc(cx, cy + 14, r, 0, Math.PI * 2); ctx.fill();
        const grad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
        grad.addColorStop(0, '#FFF2B2'); grad.addColorStop(0.5, mainColor); grad.addColorStop(1, '#9A7B1C');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#3A2A00'; ctx.font = 'bold ' + Math.round(r * 0.95) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('€', cx, cy + 4);
      }

      drawCoin(175, 295, 85, '#D4AF37', '#6E550B');
      drawCoin(335, 285, 90, '#DFB83C', '#6E550B');
      drawCoin(256, 205, 112, '#F0C946', '#5C4506');

      const pngUrl = canvas.toDataURL('image/png');
      document.getElementById('favicon-link').href = pngUrl;
      document.getElementById('apple-icon-link').href = pngUrl;
      window.__appIconPNG = pngUrl;
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase App, Firestore y AUTH SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* VARIABLES Y DISEÑO BASE */
    :root { --bg-black: #080808; --bg-card: #121212; --bg-input: #1A1A1A; --border: #242424; --gold: #D4AF37; --gold-light: #F3E5AB; --gold-glow: rgba(212, 175, 55, 0.22); --red: #E53935; --red-glow: rgba(229, 57, 53, 0.22); --blue: #3B82F6; --green: #10B981; --text: #F5F5F5; --text-muted: #9E9E9E; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-black); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 95px; }
    
    /* LOGIN SCREEN */
    #login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; transition: opacity 0.4s; }
    .login-box { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--gold); border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 40px var(--gold-glow); }
    .login-logo { width: 80px; height: 80px; margin: 0 auto 16px; }
    .login-title { font-size: 1.4rem; font-weight: 800; color: var(--gold-light); margin-bottom: 8px; }
    .login-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
    .auth-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 14px; border-radius: 10px; margin-bottom: 14px; font-family: inherit; font-size: 1rem; }
    .auth-input:focus { border-color: var(--gold); outline: none; }
    .btn-auth { width: 100%; background: linear-gradient(135deg, var(--gold), #A47E1B); color: #000; border: none; border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    .btn-auth-sec { width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; }
    
    /* APP MAIN (Se oculta hasta loguear) */
    #app-main { display: none; width: 100%; }
    
    /* RESTO DE ESTILOS (Iguales a la versión anterior) */
    header { background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 38px; height: 38px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 14px var(--gold-glow); border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; }
    .brand-icon img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 1.1rem; font-weight: 700; color: var(--gold-light); }
    .cloud-status { font-size: 0.75rem; padding: 5px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.12); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    
    main { max-width: 900px; margin: 0 auto; width: 100%; padding: 18px 14px; }
    .tab-view { display: none; animation: fadeIn 0.2s ease-in-out; }
    .tab-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .card-header { font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    
    .balances-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .balance-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .balance-box.gold-border { border-top: 3px solid var(--gold); }
    .balance-box.red-border { border-top: 3px solid var(--red); }
    .balance-title { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    .balance-amount { font-size: 1.55rem; font-weight: 800; color: var(--text); }
    .gold-text { color: var(--gold); } .red-text { color: var(--red); }
    
    .adjust-bar { display: flex; flex-wrap: wrap; gap: 10px; background: #151515; padding: 12px; border-radius: 10px; margin-bottom: 16px; border: 1px dashed var(--border); align-items: center; justify-content: space-between; }
    .adjust-bar button { background: var(--gold); color: #000; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    
    /* FORMULARIO */
    .selector-tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .btn-tipo { padding: 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--bg-input); color: var(--text-muted); font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
    .btn-tipo.active.gasto { border-color: var(--red); background: rgba(229, 57, 53, 0.12); color: var(--red); }
    .btn-tipo.active.ingreso { border-color: var(--gold); background: rgba(212, 175, 55, 0.12); color: var(--gold); }
    .input-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 14px;}
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--gold), #A47E1B); color: #000; border: none; border-radius: 10px; padding: 15px; font-size: 1rem; font-weight: 800; cursor: pointer; }
    
    /* HISTORIAL & TABLAS */
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); color: var(--gold); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    .btn-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1rem; }
    
    .hidden-zone { margin-top: 30px; padding-top: 20px; border-top: 1px solid #1C1C1C; text-align: center; }
    .btn-danger-hidden { background: transparent; color: #772222; border: 1px dashed #441818; padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin: 5px; }
    .btn-logout { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin: 5px; }
    
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(14, 14, 14, 0.98); backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 10px 14px; z-index: 100; }
    .nav-item { background: none; border: none; color: var(--text-muted); font-size: 0.74rem; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font-weight: 600; }
    .nav-item.active { color: var(--gold); }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN CON FACE ID / PASSWORD -->
  <div id="login-screen">
    <div class="login-box">
      <img src="" id="login-logo-img" class="login-logo" alt="Logo">
      <h1 class="login-title">Caja Fuerte</h1>
      <p class="login-subtitle">Inicia sesión para cargar tu perfil seguro.</p>
      
      <!-- Se usa tipo email y password para que el móvil detecte y ofrezca Face ID / Huella -->
      <input type="email" id="auth-email" class="auth-input" placeholder="Tu correo electrónico" autocomplete="username">
      <input type="password" id="auth-pass" class="auth-input" placeholder="Contraseña" autocomplete="current-password">
      
      <button class="btn-auth" onclick="iniciarSesion()">Desbloquear (Face ID / Clave)</button>
      <button class="btn-auth-sec" onclick="crearCuenta()">Crear mi cuenta nueva</button>
      <p id="auth-error" style="color: var(--red); font-size: 0.8rem; margin-top: 10px; display: none;"></p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL (Oculta hasta loguear) -->
  <div id="app-main">
    <header>
      <div class="brand">
        <div class="brand-icon"><img id="header-logo-img" alt="Logo"></div>
        <div class="brand-title" id="user-display-name">Mi Control Financiero</div>
      </div>
      <div class="cloud-status" id="cloud-indicator">
        <span>●</span> <span id="cloud-text">Conectado</span>
      </div>
    </header>

    <main>
      <!-- PESTAÑA 1: BALANCES -->
      <section id="view-home" class="tab-view active">
        <div class="adjust-bar">
          <span>⚙️ Pon tu dinero actual:</span>
          <button onclick="setInitialFunds()">Ajustar Saldos</button>
        </div>
        <div class="balances-grid">
          <div class="balance-box gold-border">
            <div class="balance-title">💰 PATRIMONIO TOTAL</div>
            <div class="balance-amount gold-text" id="kpi-total-global">0,00 €</div>
          </div>
          <div class="balance-box">
            <div class="balance-title">💳 EN TARJETA</div>
            <div class="balance-amount" id="kpi-total-tarjeta">0,00 €</div>
          </div>
          <div class="balance-box">
            <div class="balance-title">💵 EN EFECTIVO</div>
            <div class="balance-amount" id="kpi-total-efectivo">0,00 €</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Últimos Movimientos</div>
          <table>
            <tbody id="tabla-recientes"></tbody>
          </table>
        </div>
      </section>

      <!-- PESTAÑA 2: AÑADIR -->
      <section id="view-add" class="tab-view">
        <div class="card">
          <div class="card-header">Añadir Registro</div>
          <div class="selector-tipo">
            <button class="btn-tipo active gasto" id="btn-tipo-gasto" onclick="setTipo('gasto')">📉 Gasto</button>
            <button class="btn-tipo ingreso" id="btn-tipo-ingreso" onclick="setTipo('ingreso')">📈 Ingreso</button>
          </div>
          <form onsubmit="guardarMovimiento(event)">
            <input type="text" inputmode="decimal" class="input-control" id="in-importe" placeholder="Importe (€)" required style="font-size: 1.5rem; font-weight:800; color:var(--gold);">
            <select class="input-control" id="in-medio" required>
              <option value="Tarjeta / Banco">💳 Tarjeta / Banco</option>
              <option value="Efectivo">💵 Efectivo</option>
            </select>
            <select class="input-control" id="in-categoria" required></select>
            <input type="date" class="input-control" id="in-fecha" required>
            <input type="text" class="input-control" id="in-concepto" placeholder="Concepto (Opcional)">
            <button type="submit" class="btn-submit">Guardar Movimiento</button>
          </form>
        </div>
      </section>

      <!-- PESTAÑA 3: HISTORIAL & AJUSTES -->
      <section id="view-history" class="tab-view">
        <div class="card">
          <div class="card-header">Historial Completo</div>
          <table>
            <thead><tr><th>Concepto</th><th>Medio</th><th style="text-align:right;">Importe</th><th></th></tr></thead>
            <tbody id="tabla-cuerpo"></tbody>
          </table>
        </div>
        <div class="hidden-zone">
          <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom: 10px;">Opciones de Cuenta Segura</p>
          <button class="btn-logout" onclick="cerrarSesion()">🔒 Cerrar Sesión</button>
          <button class="btn-danger-hidden" onclick="resetAllToZero()">⚠️ Borrar todos mis datos</button>
        </div>
      </section>
    </main>

    <nav>
      <button class="nav-item active" onclick="cambiarPestana('home')"><span>📊</span><span>Balances</span></button>
      <button class="nav-item" onclick="cambiarPestana('add')"><span>➕</span><span>Añadir</span></button>
      <button class="nav-item" onclick="cambiarPestana('history')"><span>📑</span><span>Ajustes</span></button>
    </nav>
  </div>

  <script>
    // Inyectar el logo dibujado
    document.getElementById('header-logo-img').src = window.__appIconPNG;
    document.getElementById('login-logo-img').src = window.__appIconPNG;

    // CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBLfKa1piF3hRJcsqY_6dcSlhCe0ZaDouY",
      authDomain: "finanzas-5dd38.firebaseapp.com",
      projectId: "finanzas-5dd38",
      storageBucket: "finanzas-5dd38.firebasestorage.app",
      messagingSenderId: "469939260454",
      appId: "1:469939260454:web:221f8fd3fd68ac8ce96ae7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let docRef = null; // Documento de la base de datos (dependerá del usuario que entre)

    // VARIABLES DE DATOS
    let tipoActual = 'gasto';
    let movimientos = [];
    let saldoBase = { tarjeta: 0.00, efectivo: 0.00 };

    const CATEGORIAS = {
      gasto: ["Restaurantes", "Ocio", "Deporte", "Supermercado", "Transporte", "Vivienda", "Compras", "Imprevisto"],
      ingreso: ["Nómina", "Trabajos", "Partidos", "Regalos", "Bizum", "Otros"]
    };

    // ====== SISTEMA DE LOGIN (FACE ID / PASSWORD) ======
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Usuario logueado -> Ocultar login, mostrar app, cargar su base de datos separada
        document.getElementById('login-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-main').style.display = 'block';
        }, 400);
        
        document.getElementById('user-display-name').textContent = "Finanzas de " + user.email.split('@')[0];
        
        // CADA USUARIO TIENE SU CARPETA (user.uid)
        docRef = db.collection("datos_usuario").doc(user.uid);
        iniciarApp();

      } else {
        // No logueado -> Mostrar Login
        document.getElementById('app-main').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('login-screen').style.opacity = '1';
      }
    });

    function mostrarError(msg) {
      const err = document.getElementById('auth-error');
      err.textContent = msg;
      err.style.display = 'block';
    }

    function iniciarSesion() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      auth.signInWithEmailAndPassword(email, pass).catch(e => mostrarError("Correo o contraseña incorrectos."));
    }

    function crearCuenta() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      if(pass.length < 6) return mostrarError("La contraseña debe tener al menos 6 caracteres.");
      auth.createUserWithEmailAndPassword(email, pass).catch(e => mostrarError("Error al crear cuenta. ¿Ya existe?"));
    }

    function cerrarSesion() {
      if(confirm("¿Cerrar sesión segura?")) auth.signOut();
    }

    // ====== LÓGICA DE LA APP ======
    function iniciarApp() {
      document.getElementById('in-fecha').value = new Date().toISOString().split('T')[0];
      actualizarCategoriasSelect();

      // Escuchar cambios en vivo de SU documento
      docRef.onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          if (data.saldoBase) saldoBase = data.saldoBase;
          if (data.movimientos) movimientos = data.movimientos;
          refrescarTodo();
        } else {
          // Si es su primera vez, guardar estructura limpia
          guardarEnCloud();
        }
      });
    }

    function guardarEnCloud() {
      if(!docRef) return;
      docRef.set({ saldoBase, movimientos, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }

    function cambiarPestana(id) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(`view-${id}`).classList.add('active');
      const idx = ['home', 'add', 'history'].indexOf(id);
      if (idx >= 0) document.querySelectorAll('.nav-item')[idx].classList.add('active');
    }

    function setTipo(tipo) {
      tipoActual = tipo;
      document.getElementById('btn-tipo-gasto').classList.toggle('active', tipo === 'gasto');
      document.getElementById('btn-tipo-ingreso').classList.toggle('active', tipo === 'ingreso');
      actualizarCategoriasSelect();
    }

    function actualizarCategoriasSelect() {
      const select = document.getElementById('in-categoria');
      select.innerHTML = '';
      CATEGORIAS[tipoActual].forEach(cat => select.innerHTML += `<option value="${cat}">${cat}</option>`);
    }

    function setInitialFunds() {
      const c = prompt('Dinero en TARJETA (€):', saldoBase.tarjeta);
      if (c !== null) saldoBase.tarjeta = parseFloat(c.replace(',','.')) || 0;
      const e = prompt('Dinero en EFECTIVO (€):', saldoBase.efectivo);
      if (e !== null) saldoBase.efectivo = parseFloat(e.replace(',','.')) || 0;
      guardarEnCloud(); refrescarTodo();
    }

    function guardarMovimiento(e) {
      e.preventDefault();
      const importe = parseFloat(document.getElementById('in-importe').value.replace(',', '.'));
      if (!importe || importe <= 0) return;

      movimientos.unshift({
        id: 'mov_' + Date.now(), tipo: tipoActual, importe,
        medio: document.getElementById('in-medio').value,
        categoria: document.getElementById('in-categoria').value,
        fecha: document.getElementById('in-fecha').value,
        concepto: document.getElementById('in-concepto').value || document.getElementById('in-categoria').value
      });
      guardarEnCloud();
      document.getElementById('in-importe').value = '';
      document.getElementById('in-concepto').value = '';
      cambiarPestana('home');
    }

    function eliminarMovimiento(id) {
      if (confirm('¿Eliminar?')) { movimientos = movimientos.filter(m => m.id !== id); guardarEnCloud(); }
    }

    function resetAllToZero() {
      if (prompt('Escribe RESET:') === 'RESET') {
        movimientos = []; saldoBase = { tarjeta: 0, efectivo: 0 };
        guardarEnCloud(); alert('Todo a cero.');
      }
    }

    function refrescarTodo() {
      let st = saldoBase.tarjeta, se = saldoBase.efectivo;
      movimientos.forEach(m => {
        if (m.tipo === 'ingreso') m.medio === 'Efectivo' ? se += m.importe : st += m.importe;
        else m.medio === 'Efectivo' ? se -= m.importe : st -= m.importe;
      });

      const f = n => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
      document.getElementById('kpi-total-global').textContent = f(st + se);
      document.getElementById('kpi-total-tarjeta').textContent = f(st);
      document.getElementById('kpi-total-efectivo').textContent = f(se);

      const htmlTr = (m, esGasto) => `<tr>
        <td><div style="font-weight:700;">${m.concepto}</div><div style="font-size:0.75rem; color:var(--text-muted);">${m.fecha}</div></td>
        <td style="font-size:0.8rem; color:var(--gold);">${m.medio}</td>
        <td style="text-align:right; font-weight:800;" class="${esGasto ? 'red-text' : 'gold-text'}">${esGasto ? '-' : '+'}${f(m.importe)}</td>
        <td><button class="btn-del" onclick="eliminarMovimiento('${m.id}')">✕</button></td>
      </tr>`;

      document.getElementById('tabla-recientes').innerHTML = movimientos.slice(0,4).map(m => htmlTr(m, m.tipo === 'gasto')).join('') || '<tr><td colspan="4" style="text-align:center;color:gray;">Sin movimientos</td></tr>';
      document.getElementById('tabla-cuerpo').innerHTML = movimientos.map(m => htmlTr(m, m.tipo === 'gasto')).join('') || '<tr><td colspan="4" style="text-align:center;color:gray;">Vacío</td></tr>';
    }
  </script>
</body>
</html>
